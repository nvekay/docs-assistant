name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docs-assistant/shared build
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @docs-assistant/api test

  api-e2e:
    name: API e2e (Postgres + Redis containers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @docs-assistant/shared build
      # Testcontainers starts pgvector and Redis itself on the runner's Docker
      - run: pnpm test:e2e

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docs
          POSTGRES_PASSWORD: docs
          POSTGRES_DB: docs_assistant
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U docs" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://docs:docs@localhost:5432/docs_assistant
      REDIS_URL: redis://localhost:6379
      LLM_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      JWT_SECRET: ci-jwt-secret
      DEMO_VIEWER_EMAIL: demo@example.com
      DEMO_VIEWER_PASSWORD: demo-viewer
      # Baked into the web build, so they must be set before `pnpm build`
      NEXT_PUBLIC_DEMO_VIEWER_EMAIL: demo@example.com
      NEXT_PUBLIC_DEMO_VIEWER_PASSWORD: demo-viewer
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm migrate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
